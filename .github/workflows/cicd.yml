name: Build test scan and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: assessment-deployment
  cancel-in-progress: false

jobs:
  delivery:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      IMAGE_TAG: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Download repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build image and run tests
        run: |
          docker build --pull --platform linux/amd64 -t assessment-app:$IMAGE_TAG task-2-cicd
          docker build --platform linux/amd64 --target build -t assessment-tests task-2-cicd
          docker run --rm assessment-tests python -m unittest -v

      - name: Block HIGH and CRITICAL vulnerabilities
        uses: anchore/scan-action@0d444ed77d83ee2ba7f5ced0d90d640a1281d762 # v7.3.0
        with:
          image: assessment-app:${{ env.IMAGE_TAG }}
          fail-build: true
          severity-cutoff: high
          only-fixed: false
          output-format: table

      - name: Obtain temporary AWS credentials
        uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c # v4
        with:
          role-to-assume: arn:aws:iam::151065283508:role/assessment-github-actions
          aws-region: eu-west-1

      - name: Publish image to ECR
        run: bash task-2-cicd/publish.sh

      - name: Deploy image to ECS
        run: bash task-2-cicd/deploy.sh

      - name: Verify deployment
        run: bash task-2-cicd/verify.sh
