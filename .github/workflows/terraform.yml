name: Terraform infrastructure

on:
  pull_request:
    paths: ['task-1-iac/**', '.github/workflows/terraform.yml']
  push:
    branches: [main]
    paths: ['task-1-iac/**', '.github/workflows/terraform.yml']
  workflow_dispatch:
    inputs:
      action:
        description: 'Plan first; choose apply after reviewing proposed changes'
        type: choice
        options: [plan, apply]
        default: plan

permissions:
  contents: read

concurrency:
  group: assessment-terraform
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: 'true'

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.14.3
          terraform_wrapper: false
      - name: Test workflow control with a fake Terraform command
        run: python3 -m unittest discover -s task-1-iac/tests -v
      - name: Check formatting and configuration without AWS credentials
        run: bash task-1-iac/scripts/check.sh
      - name: Explain missing infrastructure login setup
        if: vars.TERRAFORM_ROLE_ARN == ''
        run: echo '::warning::Validation only. Set up the Terraform IAM role before AWS plan/apply can run.'

  infrastructure:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.TERRAFORM_ROLE_ARN != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      TF_ACTION: ${{ inputs.action || 'plan' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.14.3
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c # v4
        with:
          role-to-assume: ${{ vars.TERRAFORM_ROLE_ARN }}
          aws-region: eu-west-1
      - name: Plan or manually requested apply
        run: bash task-1-iac/scripts/run.sh
